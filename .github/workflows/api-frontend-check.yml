name: API and frontend checks

on:
  push:
    paths:
      - "backend/**"
      - "web/**"
      - "docs/api-backed-frontend.md"
      - ".github/workflows/api-frontend-check.yml"
  pull_request:
    paths:
      - "backend/**"
      - "web/**"
      - "docs/api-backed-frontend.md"
      - ".github/workflows/api-frontend-check.yml"

permissions:
  contents: read

jobs:
  api-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python sources
        run: python -m compileall -q backend
      - name: Test API persistence and revisions
        run: python -m unittest discover -s backend/tests -v
      - name: Check JavaScript module syntax
        run: |
          node --check web/src/api.js
          node --check web/src/model.js
          node --check web/src/ui.js
          node --check web/src/main.js
