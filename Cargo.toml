[package]
name = "bittopos-core"
version = "0.1.0"
edition = "2021"
description = "Núcleo inicial de Bittopos: recursos identificados y persistidos en TOML"
license = "AGPL-3.0-only"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
uuid = { version = "1", features = ["v7", "serde"] }
serde_json = "1.0.152"

[dev-dependencies]
tempfile = "3"

[workspace]
members = ["cli", "server"]
resolver = "2"
